[package]
name = "dankcaster_gst_plugin"
version = "0.1.0"
authors = ["Julien 'Blaxar' Bardagi <blaxar.waldarax@gmail.com>"]
repository = "https://github.com/Blaxar/DankCaster"
license = "MIT OR Apache-2.0"
edition = "2021"
rust-version = "1.80"
description = "Set of elements used by DankCaster for scene configuration"

[dependencies]
gst = { package = "gstreamer", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", tag= "0.23.3" }
gst-base = { package = "gstreamer-base", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", tag= "0.23.3" }
gst-video = { package = "gstreamer-video", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", tag= "0.23.3" }
gst-audio = { package = "gstreamer-audio", git = "https://gitlab.freedesktop.org/gstreamer/gstreamer-rs", tag= "0.23.3" }
byte-slice-cast = "1.0"
num-traits = "0.2"

[lib]
name = "gstdkcplugin"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[build-dependencies]
gst-plugin-version-helper = { git = "https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs" }